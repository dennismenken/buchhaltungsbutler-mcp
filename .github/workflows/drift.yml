name: Abdrift

# Wöchentlicher Lauf für die beiden Verschlechterungen, die sonst erst bei der nächsten
# Veröffentlichung auffielen:
#
#   1. **Generatordifferenz.** src/generated/endpoints.ts und src/generated/errors.ts sind
#      eingecheckt. Läuft der Generator und ändert etwas, passt der eingecheckte Stand nicht
#      mehr zur Spezifikationsdatei oder zu package.json. Die CI prüft das je Änderung; dieser
#      Lauf prüft es auch dann, wenn wochenlang niemand etwas ändert.
#   2. **Größenbudget.** Das gepackte und das entpackte Tarball gegen die beiden Grenzen aus
#      scripts/check-size.ts. Der teuerste Fall ist eine Abhängigkeit, die der Bündler nach
#      dist/ einrechnet, statt sie als dependency zu belassen: Die Dateiliste bleibt dabei
#      unverändert, und nur die Bytezahl verrät es.
#
# Dieser Workflow veröffentlicht nichts. Er baut, misst und meldet.

on:
  schedule:
    # Montags um 05:17 UTC. Die schiefe Minute vermeidet die volle Stunde, zu der bei GitHub
    # die geplanten Läufe aller Repositories anstehen und Läufe verzögert oder verworfen werden.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abdrift:
    runs-on: ubuntu-latest
    steps:
      # SHA-Pinnung samt Tag-Kommentar wie in ci.yml, siehe die Begründung dort.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Die Untergrenze aus engines.node in package.json.
          node-version: "22.19.0"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Generatorlauf gegen den eingecheckten Stand
        run: |
          pnpm generate
          git diff --exit-code

      - name: Bau
        run: pnpm build

      # Ohne Bau misst check-size ein Paket ohne Inhalt und meldete ein eingehaltenes Budget.
      - name: Größenbudget
        run: pnpm check-size
